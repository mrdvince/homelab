stages:
  - validate
  - test
  - renovate
  - generate
  - trigger

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - local: infrastructure/images/templates/sync.yml
  - local: infrastructure/images/templates/build.yml

workflow:
  rules:
    - if: $RUN_RENOVATE == "true"
      variables:
        SECRET_DETECTION_DISABLED: "true"
        SAST_DISABLED: "true"
    - when: always

variables:
  SECRET_DETECTION_DISABLED: "false"
  SAST_DISABLED: "false"
  SCAN_KUBERNETES_MANIFESTS: "true"
  ALPINE_IMAGE: "registry.home.mrdvince.me/library/alpine:3.23.2"
  BUILDER_IMAGE: "registry.home.mrdvince.me/homelab/builder:1.4.1"

validate-helmfile:
  stage: validate
  image: $BUILDER_IMAGE
  allow_failure: true
  script:
    - |
      test -n "${SOPS_AGE_KEY:-}"
      export SOPS_AGE_KEY
      find apps -name 'helmfile.yaml.gotmpl' -print0 | while IFS= read -r -d '' hf; do
        echo "Validating ${hf}"
        helmfile -f "${hf}" -e aion repos
        helmfile -f "${hf}" -e aion lint
        helmfile -f "${hf}" -e aion template >/dev/null
      done
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
    - if: $CI_PIPELINE_SOURCE == "web"

renovate:
  stage: renovate
  image:
    name: registry.home.mrdvince.me/renovate/renovate:43.197.0
    entrypoint: [""]
  needs: []
  dependencies: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
    RENOVATE_GIT_AUTHOR: "renovate-bot <renovate-bot@home.mrdvince.me>"
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_RENOVATE == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $RUN_RENOVATE == "true"

generate-images-pipeline:
  stage: generate
  image: $ALPINE_IMAGE
  before_script:
    - apk add --no-cache yq
  script:
    - |
      cd infrastructure/images
      cat > child-pipeline.yml << 'HEADER'
      include:
        - local: infrastructure/images/templates/sync.yml
        - local: infrastructure/images/templates/build.yml

      stages:
        - images
      HEADER

      for file in images/*.yaml; do
        name=$(basename "${file}" .yaml)
        cat >> child-pipeline.yml << EOF

      sync-${name}:
        stage: images
        extends: .sync-images
        variables:
          IMAGE_FILE: "infrastructure/images/${file}"
        rules:
          - if: \$PARENT_PIPELINE_SOURCE == "web"
          - if: \$SYNC_ALL == "true"
          - if: \$PARENT_PIPELINE_SOURCE == "merge_request_event"
            changes:
              - infrastructure/images/${file}
              - infrastructure/images/templates/sync.yml
          - changes:
              - infrastructure/images/${file}
              - infrastructure/images/templates/sync.yml
      EOF
      done

      for file in builds/*.yaml; do
        [ -f "$file" ] || continue
        name=$(basename "${file}" .yaml)
        dockerfile_changes=$(yq e '.. | .dockerfile? | select(.)' "$file" | sed '/^$/d' | sort -u | sed 's|^|        - |')
        cat >> child-pipeline.yml << EOF

      build-${name}:
        stage: images
        extends: .build-images
        variables:
          BUILD_FILE: "infrastructure/images/${file}"
        rules:
          - if: \$PARENT_PIPELINE_SOURCE == "web"
          - if: \$BUILD_ALL == "true"
          - if: \$PARENT_PIPELINE_SOURCE == "merge_request_event"
            changes:
              - infrastructure/images/${file}
              - infrastructure/images/templates/build.yml
      ${dockerfile_changes}
          - changes:
              - infrastructure/images/${file}
              - infrastructure/images/templates/build.yml
      ${dockerfile_changes}
      EOF
      done

      echo "Generated child pipeline:"
      cat child-pipeline.yml
      mv child-pipeline.yml ../../
  artifacts:
    paths:
      - child-pipeline.yml
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SYNC_ALL == "true" || $BUILD_ALL == "true")

trigger-images-sync:
  stage: trigger
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-images-pipeline
    strategy: depend
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SYNC_ALL == "true" || $BUILD_ALL == "true")

publish-charts:
  stage: generate
  needs: []
  image: $BUILDER_IMAGE
  script:
    - |
      for chart in charts/*/Chart.yaml; do
        dir=$(dirname "$chart")
        name=$(grep '^name:' "$chart" | awk '{print $2}')
        version=$(grep '^version:' "$chart" | awk '{print $2}')
        echo "Packaging ${name}..."
        helm dependency update "$dir"
        helm package "$dir" --destination .

        tgz="${name}-${version}.tgz"
        if [ ! -f "$tgz" ]; then
          echo "Failed to package ${name}"
          exit 1
        fi

        echo "Pushing ${tgz} to Helm registry..."
        curl --fail-with-body --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
          --form "chart=@${tgz}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"

        rm -f "$tgz"
      done
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - charts/**/*
