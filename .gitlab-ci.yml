stages:
  - test
  - renovate
  - build
  - sync-local
  - sync-chart

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - local: ci/generated-images.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"
      variables:
        SECRET_DETECTION_DISABLED: "true"
        SAST_DISABLED: "true"
    - when: always

variables:
  SECRET_DETECTION_DISABLED: "false"
  SAST_DISABLED: "false"
  SCAN_KUBERNETES_MANIFESTS: "true"
  BUILDER_BOOTSTRAP_IMAGE: "registry.home.mrdvince.me/homelab/builder:1.4.3"
  BUILDER_IMAGE: "registry.home.mrdvince.me/homelab/builder:1.4.3"
  # renovate: datasource=npm depName=renovate
  RENOVATE_IMAGE: "registry.home.mrdvince.me/homelab/renovate:43.279.1"

renovate:
  stage: renovate
  image:
    name: $RENOVATE_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_ALLOWED_COMMANDS: '["^nu ci/images\\.nu generate-ci$"]'
    LOG_LEVEL: info
  script:
    - renovate "$CI_PROJECT_PATH"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"
    - if: $RENOVATE == "true"
      when: manual

verify:image-inventory:
  stage: test
  image:
    name: $BUILDER_BOOTSTRAP_IMAGE
    entrypoint: [""]
  script:
    - nu ci/images.nu verify-ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &image_inventory_changes
        - apps/**/*
        - infrastructure/images/builds/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/images/local/*.yaml
        - infrastructure/images/config.yaml
        - ci/images.nu
        - ci/lib/**/*
        - ci/generated-images.gitlab-ci.yml
        - renovate.json
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *image_inventory_changes

verify:ci-scripts:
  stage: test
  image:
    name: $BUILDER_BOOTSTRAP_IMAGE
    entrypoint: [""]
  script:
    - nu ci/tests/generated-ci.nu
    - nu ci/tests/images.nu
    - nu ci/tests/renovate.nu
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes:
        - .gitlab-ci.yml
        - ci/**/*
        - renovate.json

verify:chart-inventory:
  stage: test
  image:
    name: $BUILDER_BOOTSTRAP_IMAGE
    entrypoint: [""]
  script:
    - nu ci/charts.nu verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &chart_inventory_changes
        - apps/**/helmfile.yaml.gotmpl
        - charts/**/*
        - infrastructure/charts/sources.yaml
        - ci/charts.nu
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *chart_inventory_changes

.build-image:
  stage: build
  image:
    name: $BUILDER_BOOTSTRAP_IMAGE
    entrypoint: [""]
  services:
    - name: docker:29-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_BUILDKIT: "1"
  before_script:
    - nu ci/images.nu wait-for-docker
  script:
    - nu ci/images.nu build "$BUILD_NAME"

.sync-image:
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  script:
    - nu ci/images.nu sync-one "$IMAGE_TO_SYNC"

.sync-local-image:
  extends: .sync-image
  stage: sync-local

.sync-chart-image:
  extends: .sync-image
  stage: sync-chart

sync:helm-charts:
  stage: sync-chart
  needs: []
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  script:
    - test -n "${SOPS_AGE_KEY:-}"
    - export ZOT_USERNAME="$(sops --decrypt --extract '["zot"]["charon_username"]' secrets/secrets.enc.yaml)"
    - test -n "${ZOT_USERNAME:-}"
    - sops --decrypt --extract '["zot"]["charon_password"]' secrets/secrets.enc.yaml | helm registry login zot.home.mrdvince.me --username "$ZOT_USERNAME" --password-stdin
    - nu ci/charts.nu sync --latest
    - nu ci/charts.nu verify-remote
    - helm registry logout zot.home.mrdvince.me
    - unset ZOT_USERNAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *chart_inventory_changes
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "api"
      when: manual
