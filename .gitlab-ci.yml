stages:
  - test
  - build
  - sync

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

variables:
  SECRET_DETECTION_DISABLED: "false"
  SAST_DISABLED: "false"
  SCAN_KUBERNETES_MANIFESTS: "true"
  BUILDER_IMAGE: "registry.home.mrdvince.me/homelab/builder:1.4.1"

.chart_image_rules:
  rules:
    - if: $SYNC_UPSTREAM_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - apps/**/helmfile.yaml.gotmpl
        - apps/**/values.yaml.gotmpl
        - infrastructure/images/config.yaml
        - ci/images.sh

.local_image_rules:
  rules:
    - if: $SYNC_LOCAL_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - infrastructure/images/images/local/*.yaml
        - ci/images.sh

.build_image_rules:
  rules:
    - if: $BUILD_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /build-all/
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - infrastructure/images/builds/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - ci/images.sh

image-builds:
  extends: .build_image_rules
  stage: build
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  script:
    - sh ci/images.sh build-pipeline
  artifacts:
    when: always
    paths:
      - build-images.txt
      - build-images.yml
    expire_in: 1 week

image-build:
  extends: .build_image_rules
  stage: build
  trigger:
    include:
      - artifact: build-images.yml
        job: image-builds
    strategy: depend
  needs:
    - image-builds

chart-images:
  extends: .chart_image_rules
  stage: sync
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  script:
    - sh ci/images.sh chart-pipeline
  artifacts:
    when: always
    paths:
      - imagelist.txt
      - chart-images.yml
    expire_in: 1 week

chart-sync:
  extends: .chart_image_rules
  stage: sync
  trigger:
    include:
      - artifact: chart-images.yml
        job: chart-images
    strategy: depend
  needs:
    - chart-images

local-images:
  extends: .local_image_rules
  stage: sync
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  script:
    - sh ci/images.sh local-pipeline
  artifacts:
    when: always
    paths:
      - local-imagelist.txt
      - local-images.yml
    expire_in: 1 week

local-sync:
  extends: .local_image_rules
  stage: sync
  trigger:
    include:
      - artifact: local-images.yml
        job: local-images
    strategy: depend
  needs:
    - local-images
