stages:
  - validate
  - test
  - renovate
  - generate
  - trigger

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - local: ci/includes/mirror.yml
  - local: infrastructure/images/templates/sync.yml
  - local: infrastructure/images/templates/build.yml

workflow:
  rules:
    - if: $RUN_RENOVATE == "true"
      variables:
        SECRET_DETECTION_DISABLED: "true"
        SAST_DISABLED: "true"
    - when: always

variables:
  SECRET_DETECTION_DISABLED: "false"
  SAST_DISABLED: "false"
  SCAN_KUBERNETES_MANIFESTS: "true"
  ALPINE_IMAGE: "registry.home.mrdvince.me/library/alpine:3.23.2"
  BUILDER_IMAGE: "registry.home.mrdvince.me/homelab/builder:1.4.1"

validate-helmfile:
  stage: validate
  image: $BUILDER_IMAGE
  script:
    - |
      test -n "${SOPS_AGE_KEY:-}"
      export SOPS_AGE_KEY
      find apps -name 'helmfile.yaml.gotmpl' -print0 | while IFS= read -r -d '' hf; do
        echo "Validating ${hf}"
        helmfile -f "${hf}" -e aion repos
        helmfile -f "${hf}" -e aion lint
        helmfile -f "${hf}" -e aion template >/dev/null
      done
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
    - if: $CI_PIPELINE_SOURCE == "web"

renovate:
  stage: renovate
  image:
    name: registry.home.mrdvince.me/renovate/renovate:43.197.0
    entrypoint: [""]
  needs: []
  dependencies: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: "required"
    RENOVATE_GIT_AUTHOR: "renovate-bot <renovate-bot@home.mrdvince.me>"
    LOG_LEVEL: info
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_RENOVATE == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $RUN_RENOVATE == "true"

retag-local-builds:
  stage: validate
  image: $BUILDER_IMAGE
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  script:
    - ci/images.sh retag-local-builds
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//
      changes:
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - ci/images.sh

generate-images-pipeline:
  stage: generate
  needs:
    - job: retag-local-builds
      optional: true
  image: $BUILDER_IMAGE
  script:
    - ci/images.sh pipeline
  artifacts:
    paths:
      - child-pipeline.yml
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
        - ci/images.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
        - ci/images.sh
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SYNC_ALL == "true" || $BUILD_ALL == "true")

trigger-images-sync:
  stage: trigger
  needs:
    - job: generate-images-pipeline
      artifacts: true
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-images-pipeline
    strategy: depend
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
        - ci/images.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infrastructure/images/images/**/*.yaml
        - infrastructure/images/builds/**/*.yaml
        - infrastructure/images/dockerfiles/**/*
        - infrastructure/images/templates/**/*.yml
        - ci/images.sh
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule" && ($SYNC_ALL == "true" || $BUILD_ALL == "true")

publish-charts:
  stage: generate
  image: $BUILDER_IMAGE
  script:
    - ci/charts.sh publish
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - charts/**/*
        - ci/charts.sh
