apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: https://ntfy.home.mrdvince.me/
          httpMethod: POST
          payload:
            template: |
              {
                "topic": "realm",
                "title": {{ "{{" }} printf "%q" (printf "[%s] %s" (toUpper .Status) .CommonLabels.alertname) {{ "}}" }},
                "message": {{ "{{" }} printf "%q" (printf "%s\n\n%s\n\n%s" (or .CommonAnnotations.summary "grafana alert notification") (or .CommonAnnotations.action "open grafana and inspect the alert.") ((index .Alerts 0).GeneratorURL)) {{ "}}" }},
                "priority": {{ "{{" }} if eq .Status "firing" {{ "}}" }}5{{ "{{" }} else {{ "}}" }}3{{ "{{" }} end {{ "}}" }},
                "tags": [{{ "{{" }} if eq .Status "firing" {{ "}}" }}"warning"{{ "{{" }} else {{ "}}" }}"white_check_mark"{{ "{{" }} end {{ "}}" }}],
                "click": {{ "{{" }} printf "%q" ((index .Alerts 0).GeneratorURL) {{ "}}" }}
              }
        disableResolveMessage: false
