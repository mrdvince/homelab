apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: https://ntfy.home.mrdvince.me/
          httpMethod: POST
          payload:
            template: |
              {
                "topic": "realm",
                "title": {{ "{{" }} printf "%q" (printf "[%s][%s] %s (%d)" (toUpper .Status) (toUpper (or .CommonLabels.severity "unknown")) .CommonLabels.alertname (len .Alerts)) {{ "}}" }},
                "message": {{ "{{" }}- $message := "" -{{ "}}" }}{{ "{{" }}- range .Alerts -{{ "}}" }}{{ "{{" }}- $summary := or (index .Annotations "summary") .Labels.alertname -{{ "}}" }}{{ "{{" }}- $description := or (index .Annotations "description") "impact not provided; inspect the linked alert." -{{ "}}" }}{{ "{{" }}- $action := or (index .Annotations "action") (index .Annotations "runbook_url") "open the linked alert and inspect the affected target." -{{ "}}" }}{{ "{{" }}- $message = printf "%s[%s] %s\nimpact: %s\naction: %s\n%s\n\n" $message (toUpper .Status) $summary $description $action .GeneratorURL -{{ "}}" }}{{ "{{" }}- end -{{ "}}" }}{{ "{{" }} printf "%q" $message {{ "}}" }},
                "priority": {{ "{{" }} if eq .Status "resolved" {{ "}}" }}2{{ "{{" }} else if eq .CommonLabels.severity "critical" {{ "}}" }}5{{ "{{" }} else {{ "}}" }}3{{ "{{" }} end {{ "}}" }},
                "tags": [{{ "{{" }} if eq .Status "resolved" {{ "}}" }}"white_check_mark"{{ "{{" }} else if eq .CommonLabels.severity "critical" {{ "}}" }}"rotating_light"{{ "{{" }} else {{ "}}" }}"warning"{{ "{{" }} end {{ "}}" }}],
                "click": {{ "{{" }} printf "%q" ((index .Alerts 0).GeneratorURL) {{ "}}" }}
              }
        disableResolveMessage: false
