apiVersion: 1
contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy
        type: webhook
        settings:
          url: __NTFY_BASE_URL__?template=grafana
          httpMethod: POST
          title: '{{ "{{" }} .Status | toUpper {{ "}}" }}: {{ "{{" }} .CommonLabels.alertname {{ "}}" }} ({{ "{{" }} len .Alerts {{ "}}" }})'
          message: |-
            {{ "{{" }} range .Alerts {{ "}}" }}
            {{ "{{" }} index .Annotations "summary" {{ "}}" }}
            details: {{ "{{" }} .GeneratorURL {{ "}}" }}
            silence: {{ "{{" }} .SilenceURL {{ "}}" }}
            {{ "{{" }} end {{ "}}" }}
        disableResolveMessage: false
