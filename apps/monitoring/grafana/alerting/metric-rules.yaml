apiVersion: 1
groups:
  - orgId: 1
    name: metrics
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: proxmox-node-metrics-missing
        title: Proxmox node metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'max by (name) (pve_node_info{exporter="pve"}) unless on (name) label_replace(max by (instance) (up{platform="proxmox",exporter="node"} == 1), "name", "$1", "instance", "(.*)")'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: &reduce
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: &greater-than-zero
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: 'Proxmox node {{ "{{" }} $labels.name {{ "}}" }} has sent no node-exporter metrics for 10 minutes.'
          description: Host resource and filesystem telemetry is unavailable, but the PVE API still reports the node.
          query: 'max by (name) (pve_node_info{exporter="pve"}) unless on (name) label_replace(max by (instance) (up{platform="proxmox",exporter="node"} == 1), "name", "$1", "instance", "(.*)")'
          action: 'Check the olly metrics container and Prometheus remote-write path on {{ "{{" }} $labels.name {{ "}}" }}.'
        labels: &warning-observability-labels
          severity: warning
          team: homelab
          source: metrics
          area: observability
      - uid: prometheus-query-unavailable
        title: Grafana cannot query Prometheus
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'vector(1)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Grafana has been unable to query Prometheus for 5 minutes.
          description: Metrics-backed infrastructure and workload alerts may be stale or unavailable.
          query: 'vector(1)'
          action: Check the Grafana-to-Prometheus service path and the Prometheus workload in monitoring.
        labels: *warning-observability-labels
      - uid: postgresql-connections-exhausted
        title: PostgreSQL connection capacity low
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '100 * sum by (namespace, pod, cluster) (cnpg_backends_total) / (max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="max_connections"}) - max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="superuser_reserved_connections"}) - max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="reserved_connections"}))'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'PostgreSQL {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }}) is using {{ "{{" }} printf "%.1f" $values.B.Value {{ "}}" }}% of client connection capacity.'
          description: Fewer than 10% of ordinary client connection slots remain, so new application connections may soon be rejected.
          query: '100 * sum by (namespace, pod, cluster) (cnpg_backends_total) / (max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="max_connections"}) - max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="superuser_reserved_connections"}) - max by (namespace, pod, cluster) (cnpg_pg_settings_setting{name="reserved_connections"}))'
          action: 'Identify the connection source, clear leaked or stale idle sessions, then review pool sizing and max_connections for {{ "{{" }} $labels.cluster {{ "}}" }}.'
        labels:
          severity: critical
          team: homelab
          source: metrics
          area: database
      - uid: pve-exporter-missing
        title: PVE exporter metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '(up{platform="proxmox",exporter="pve"} == bool 0) or absent(up{platform="proxmox",exporter="pve"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *greater-than-zero
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: PVE API metrics have not reached Prometheus for 10 minutes.
          description: Proxmox node, VM, and storage state cannot be evaluated from the PVE API exporter.
          query: '(up{platform="proxmox",exporter="pve"} == bool 0) or absent(up{platform="proxmox",exporter="pve"})'
          action: Check pve-exporter and the olly metrics pipeline on elysium.
        labels: *warning-observability-labels
      - uid: opnsense-exporter-missing
        title: OPNsense exporter metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '(up{platform="opnsense",exporter="opnsense",instance="opnsense"} == bool 0) or absent(up{platform="opnsense",exporter="opnsense",instance="opnsense"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *greater-than-zero
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: OPNsense API metrics have not reached Prometheus for 10 minutes.
          description: Firewall service state cannot be evaluated through the OPNsense exporter.
          query: '(up{platform="opnsense",exporter="opnsense",instance="opnsense"} == bool 0) or absent(up{platform="opnsense",exporter="opnsense",instance="opnsense"})'
          action: Check opnsense-exporter and the olly metrics pipeline on elysium.
        labels: *warning-observability-labels
      - uid: opnsense-snmp-missing
        title: OPNsense SNMP metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '(up{platform="opnsense",exporter="snmp",instance="opnsense"} == bool 0) or absent(up{platform="opnsense",exporter="snmp",instance="opnsense"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *greater-than-zero
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: OPNsense SNMP metrics have not reached Prometheus for 10 minutes.
          description: Firewall filesystem and interface capacity cannot be evaluated through SNMP.
          query: '(up{platform="opnsense",exporter="snmp",instance="opnsense"} == bool 0) or absent(up{platform="opnsense",exporter="snmp",instance="opnsense"})'
          action: Check SNMP on OPNsense and the olly metrics pipeline on elysium.
        labels: *warning-observability-labels
      - uid: pve-node-down
        title: Proxmox node unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'pve_up{exporter="pve",id=~"node/.+"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: &less-than-one
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: 'Proxmox node {{ "{{" }} $labels.id {{ "}}" }} has been unavailable for 10 minutes.'
          description: VMs on the node are unavailable or at risk, and cluster quorum may be reduced.
          query: 'pve_up{exporter="pve",id=~"node/.+"}'
          action: 'Check power, networking, and Proxmox quorum for {{ "{{" }} $labels.id {{ "}}" }}.'
        labels: &critical-proxmox-labels
          severity: critical
          team: homelab
          source: metrics
          area: proxmox
      - uid: pve-storage-critical
        title: Proxmox storage nearly full
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '100 * pve_disk_usage_bytes{exporter="pve",id=~"storage/.+"} / pve_disk_size_bytes{exporter="pve"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: &greater-than-ninety-five
              conditions:
                - evaluator:
                    params: [95]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: 'Proxmox storage {{ "{{" }} $labels.id {{ "}}" }} has been {{ "{{" }} printf "%.1f" $values.B.Value {{ "}}" }}% full for 15 minutes.'
          description: Further writes, snapshots, backups, or VM operations may fail when the storage fills.
          query: '100 * pve_disk_usage_bytes{exporter="pve",id=~"storage/.+"} / pve_disk_size_bytes{exporter="pve"}'
          action: 'Free space or move workloads from {{ "{{" }} $labels.id {{ "}}" }} before it reaches capacity.'
        labels: *critical-proxmox-labels
      - uid: opnsense-essential-service-down
        title: OPNsense essential service unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'opnsense_services_status{opnsense_instance="opnsense",name=~"haproxy|kea-dhcp|pf|routing|unbound"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *less-than-one
        noDataState: OK
        execErrState: OK
        for: 5m
        annotations:
          summary: 'OPNsense service {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.description {{ "}}" }}) has been down for 5 minutes.'
          description: DNS, DHCP, routing, packet filtering, or ingress may be unavailable depending on the affected service.
          query: 'opnsense_services_status{opnsense_instance="opnsense",name=~"haproxy|kea-dhcp|pf|routing|unbound"}'
          action: 'Check and restore {{ "{{" }} $labels.name {{ "}}" }} in the OPNsense GUI or on vale.'
        labels:
          severity: critical
          team: homelab
          source: metrics
          area: opnsense
      - uid: opnsense-supporting-service-down
        title: OPNsense supporting service unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'opnsense_services_status{opnsense_instance="opnsense",name=~"crowdsec|ntpd|snmpd|syslog-ng"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *less-than-one
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: 'OPNsense service {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.description {{ "}}" }}) has been down for 10 minutes.'
          description: Security enforcement, time synchronization, or observability is degraded; packet forwarding remains independently monitored.
          query: 'opnsense_services_status{opnsense_instance="opnsense",name=~"crowdsec|ntpd|snmpd|syslog-ng"}'
          action: 'Check and restore {{ "{{" }} $labels.name {{ "}}" }} in the OPNsense GUI or on vale.'
        labels:
          severity: warning
          team: homelab
          source: metrics
          area: opnsense
      - uid: opnsense-storage-warning
        title: OPNsense filesystem nearly full
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: '100 * hrStorageUsed{instance="opnsense",exporter="snmp",hrStorageType="1.3.6.1.2.1.25.2.1.4",hrStorageDescr=~"/|/var/log|/tmp"} / hrStorageSize{instance="opnsense",exporter="snmp",hrStorageType="1.3.6.1.2.1.25.2.1.4",hrStorageDescr=~"/|/var/log|/tmp"}'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model: *reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params: [90]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: 'OPNsense filesystem {{ "{{" }} $labels.hrStorageDescr {{ "}}" }} has been {{ "{{" }} printf "%.1f" $values.B.Value {{ "}}" }}% full for 15 minutes.'
          description: Logs, updates, and service writes may fail if this filesystem reaches capacity.
          query: '100 * hrStorageUsed{instance="opnsense",exporter="snmp",hrStorageDescr=~"/|/var/log|/tmp"} / hrStorageSize{instance="opnsense",exporter="snmp",hrStorageDescr=~"/|/var/log|/tmp"}'
          action: 'Inspect {{ "{{" }} $labels.hrStorageDescr {{ "}}" }} usage and remove or rotate safe-to-delete files.'
        labels:
          severity: warning
          team: homelab
          source: metrics
          area: opnsense
