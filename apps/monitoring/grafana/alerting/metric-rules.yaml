          summary: OPNsense filesystem usage is above 90%.
          query: '100 * hrStorageUsed{instance="opnsense",exporter="snmp",hrStorageDescr=~"/|/var/log|/tmp"} / hrStorageSize{instance="opnsense",exporter="snmp",hrStorageDescr=~"/|/var/log|/tmp"} > 90'
          action: Check OPNsense filesystem usage, especially /var/log and /tmp.
        labels:
          severity: critical
          team: homelab
          source: metrics
          area: opnsense
