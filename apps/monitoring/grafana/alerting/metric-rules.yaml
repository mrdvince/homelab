apiVersion: 1
groups:
  - orgId: 1
    name: metrics
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: proxmox-node-metrics-missing
        title: Proxmox node metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'max by (name) (pve_node_info{exporter="pve"}) unless on (name) label_replace(max by (instance) (up{platform="proxmox",exporter="node"}), "name", "$1", "instance", "(.*)")'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: A Proxmox node exists in PVE but has no matching node exporter metrics.
          query: 'max by (name) (pve_node_info{exporter="pve"}) unless on (name) label_replace(max by (instance) (up{platform="proxmox",exporter="node"}), "name", "$1", "instance", "(.*)")'
          action: Check the olly metrics container and Prometheus remote write path on the affected Proxmox node.
        labels:
          severity: critical
          team: homelab
          source: metrics
          area: observability
      - uid: pve-exporter-missing
        title: PVE exporter metrics missing
        condition: C
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: PBFA97CFB590B2093
              editorMode: code
              expr: 'absent_over_time(up{platform="proxmox",exporter="pve"}[10m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: PVE exporter metrics have stopped arriving.
          query: 'absent_over_time(up{platform="proxmox",exporter="pve"}[10m])'
          action: Check pve-exporter and olly metrics on elysium.
        labels:
          severity: critical
          team: homelab
          source: metrics
          area: observability
      - uid: opnsense-exporter-missing
