apiVersion: 1
policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by:
      - grafana_folder
      - alertname
      - area
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ntfy
        object_matchers:
          - - severity
            - =
            - critical
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: false
      - receiver: ntfy
        object_matchers:
          - - severity
            - =
            - warning
        group_wait: 5m
        group_interval: 10m
        repeat_interval: 12h
        continue: false
