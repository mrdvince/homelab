          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Repeated crash, panic, or OOM-like log lines were seen in a Kubernetes workload.
          query: '{namespace!="", namespace!="monitoring"} |~ "(?i)(panic|fatal|segfault|oomkilled|out of memory|database is locked)"'
          action: Check the affected namespace/app/container logs and pod restart state.
        labels:
          severity: critical
          team: homelab
          source: logs
          area: kubernetes
