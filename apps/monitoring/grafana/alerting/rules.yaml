apiVersion: 1
groups:
  - orgId: 1
    name: logs
    folder: Homelab Alerts
    interval: 1m
    rules:
      - uid: proxmox-critical-journal
        title: Proxmox critical journal entries
        condition: C
        data:
          - refId: A
            datasourceUid: P8E80F9AEF21F6940
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              editorMode: code
              expr: 'sum by (instance, unit, level) (count_over_time({platform="proxmox", source="journal", level=~"emerg|alert|crit"}[5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Critical systemd journal entries were logged on a Proxmox host.
          query: '{platform="proxmox", source="journal", level=~"emerg|alert|crit"}'
          action: Check the affected host journal and recent service failures.
        labels:
          severity: critical
          team: homelab
          source: logs
          area: proxmox
      - uid: proxmox-ssh-bruteforce
        title: Proxmox SSH brute-force burst
        condition: C
        data:
          - refId: A
            datasourceUid: P8E80F9AEF21F6940
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: loki
                uid: P8E80F9AEF21F6940
              editorMode: code
              expr: 'sum by (instance) (count_over_time({platform="proxmox", log_type="ssh"} |~ "(?i)(failed password|invalid user|authentication failure|maximum authentication attempts|disconnecting authenticating user)" [10m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 19
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: A burst of SSH authentication failures was logged on a Proxmox host.
          query: '{platform="proxmox", log_type="ssh"} |~ "(?i)(failed password|invalid user|authentication failure|maximum authentication attempts|disconnecting authenticating user)"'
          action: Check the source addresses in auth logs and firewall/CrowdSec state.
        labels:
          severity: critical
          team: homelab
          source: logs
          area: proxmox
