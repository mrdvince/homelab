.rendered-image-scan:
  interruptible: true
  image:
    name: registry.home.mrdvince.me/homelab/builder:1.4.1
    entrypoint: [""]
  variables:
    SEVERITY_THRESHOLD: "CRITICAL,HIGH"
  script:
    - ci/mirror.sh scan-one
  artifacts:
    when: always
    paths:
      - trivy-report.json
      - trivy-error.log
    expire_in: 1 week

.rendered-image-sync:
  interruptible: true
  image:
    name: registry.home.mrdvince.me/homelab/builder:1.4.1
    entrypoint: [""]
  variables:
    DEST_REGISTRY: registry.home.mrdvince.me
  before_script:
    - |
      printf '%s' "${REGISTRY_PASSWORD}" | skopeo login -u "${REGISTRY_USER}" --password-stdin "${DEST_REGISTRY}"
  script:
    - ci/mirror.sh sync-one
