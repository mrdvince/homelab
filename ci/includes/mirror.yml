.rendered-image-pipeline:
  stage: generate
  image:
    name: $BUILDER_IMAGE
    entrypoint: [""]
  variables:
    RENDERED_MANIFEST_DIR: /tmp/rendered-manifests
    RENDERED_IMAGE_LIST: imagelist.txt
    CHILD_PIPELINE_FILE: rendered-pipeline.yml
    SYNC_IMAGES: "true"
  script:
    - test -n "${SOPS_AGE_KEY:-}"
    - touch rendered-pipeline.yml rendered-scan-pipeline.yml
    - ci/mirror.sh pipeline
    - test -s "${RENDERED_IMAGE_LIST}"
    - test -s "${CHILD_PIPELINE_FILE}"
  artifacts:
    when: always
    paths:
      - imagelist.txt
      - rendered-pipeline.yml
      - rendered-scan-pipeline.yml
    expire_in: 1 week

generate-rendered-image-pipeline:
  extends: .rendered-image-pipeline
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "api" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
        - infrastructure/images/images/upstream/**/*.yaml
        - ci/includes/imagegate.yml
        - ci/includes/mirror.yml
        - ci/mirror.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
        - infrastructure/images/images/upstream/**/*.yaml
        - ci/includes/imagegate.yml
        - ci/includes/mirror.yml
        - ci/mirror.sh

trigger-rendered-image-sync:
  stage: trigger
  needs:
    - job: generate-rendered-image-pipeline
      artifacts: true
  trigger:
    include:
      - artifact: rendered-pipeline.yml
        job: generate-rendered-image-pipeline
    strategy: depend
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "api" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SYNC_ALL == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SYNC_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
        - infrastructure/images/images/upstream/**/*.yaml
        - ci/includes/imagegate.yml
        - ci/includes/mirror.yml
        - ci/mirror.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/**/*
        - charts/**/*
        - secrets/secrets.enc.yaml
        - infrastructure/images/images/upstream/**/*.yaml
        - ci/includes/imagegate.yml
        - ci/includes/mirror.yml
        - ci/mirror.sh

generate-rendered-image-scan-pipeline:
  extends: .rendered-image-pipeline
  variables:
    CHILD_PIPELINE_FILE: rendered-scan-pipeline.yml
    FAIL_ON_IMAGE_VULNERABILITIES: "true"
    SYNC_IMAGES: "false"
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $SCAN_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCAN_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SCAN_RENDERED_IMAGES == "true"

trigger-rendered-image-scan:
  stage: trigger
  needs:
    - job: generate-rendered-image-scan-pipeline
      artifacts: true
  trigger:
    include:
      - artifact: rendered-scan-pipeline.yml
        job: generate-rendered-image-scan-pipeline
    strategy: depend
  rules:
    - if: $RUN_RENOVATE == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "api" && $SCAN_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCAN_RENDERED_IMAGES == "true"
    - if: $CI_PIPELINE_SOURCE == "web" && $SCAN_RENDERED_IMAGES == "true"
